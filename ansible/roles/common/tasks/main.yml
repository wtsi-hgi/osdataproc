---

- name: Include IP addresses
  include_vars:
          file: "{{ lookup('env', 'TF_STATE_DIR') }}/terraform.tfstate.d/{{ lookup('env', 'TF_VAR_cluster_name') }}/outputs.json"
          name: ip_addresses
  tags: master

- name: Write hosts file
  become: yes
  template: src=hosts.j2 dest=/etc/hosts
  tags: master

# NOTE Sanger-specific
- name: Add Sanger domain resolution rule
  become: yes
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    insertafter: "[Resolve]"
    line: "Domains=sanger.ac.uk internal.sanger.ac.uk"

- name: Restart systemd resolver
  become: yes
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  async: 30
  poll: 0

- name: Wait for SSH after resolver restart
  wait_for_connection:
    timeout: 120
    delay: 2

- name: Wait for automatic system updates
  become: true
  shell: |
    while \
      fuser /var/lib/dpkg/lock >/dev/null 2>&1 || \
      fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
      fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || \
      fuser /var/cache/apt/archives/lock >/dev/null 2>&1 || \
      systemctl is-active --quiet apt-daily.service || \
      systemctl is-active --quiet apt-daily-upgrade.service; do
      sleep 5
    done
  changed_when: false

- name: Update apt cache
  apt: update_cache=yes
  register: apt_cache_update
  retries: 20
  delay: 15
  until: apt_cache_update is succeeded

- name: Create nfs shared data directory
  file:
          state: directory
          path: "{{ home }}/data"
          owner: "{{ user }}"
          group: "{{ group }}"

- name: Install Python packages
  become: yes
  apt:
          name: "{{ python_pkgs }}"
          state: latest
  register: python_pkg_install
  retries: 20
  delay: 15
  until: python_pkg_install is succeeded

- name: Add deadsnakes PPA for Python 3.12
  become: yes
  apt_repository:
    repo: ppa:deadsnakes/ppa
    state: present

- name: Install Python 3.12 from deadsnakes PPA
  become: yes
  apt:
    name:
      - python3.12
      - python3.12-venv
      - python3.12-dev
    state: present
  register: python312_install
  retries: 20
  delay: 15
  until: python312_install is succeeded

- name: Install Java packages
  become: yes
  apt:
          name: "{{ java_pkgs }}"
          state: latest
  register: java_pkg_install
  retries: 20
  delay: 15
  until: java_pkg_install is succeeded

- name: Install Scala
  become: yes
  apt:
          name: scala
          state: latest
  register: scala_install
  retries: 20
  delay: 15
  until: scala_install is succeeded

- name: Install NFS packages
  become: yes
  apt:
          name: "{{ nfs_pkgs }}"
          state: latest
  register: nfs_pkg_install
  retries: 20
  delay: 15
  until: nfs_pkg_install is succeeded

- name: Disable NFS server
  service: name=nfs-server state=stopped enabled=no
  tags: master

- name: Install nginx packages
  become: yes
  apt:
          name: "{{ nginx_pkgs }}"
          state: latest
  register: nginx_pkg_install
  retries: 20
  delay: 15
  until: nginx_pkg_install is succeeded
  tags: master

- name: Download nginx sources
  get_url:
    url: "{{ nginx_tarball_url }}"
    dest: "/tmp/{{ nginx_version }}.tar.gz"
  register: nginx_source
  tags: master

- name: Unpack nginx
  unarchive:
    copy: no
    dest: /tmp/
    src: "{{ nginx_source.dest }}"
  when: nginx_source.changed
  register: nginx_source_unpack
  tags: master

- name: Create required Nginx dirs
  become: yes
  file:
          path: "{{ item }}"
          state: directory
          owner: root
          group: root
          mode: 0755
  loop:
          - "{{ nginx_prefix }}"
  tags: master

- name: Install nginx http_substitutions_filter_module
  git:
          repo: https://github.com/yaoweibin/ngx_http_substitutions_filter_module.git
          dest: "{{ subs_filter_path }}"
          version: master
          depth: 1
  when: nginx_source_unpack.changed
  tags: master

- name: Configuring nginx source with custom modules
  become: yes
  command: "./configure --prefix={{ nginx_prefix }} {{ nginx_custom_modules }} --add-module={{ subs_filter_path }}"
  args:
          chdir: "{{ nginx_install_dir }}"
  environment:
          CFLAGS: "-Wno-error=deprecated-declarations"
  when: nginx_source_unpack.changed
  register: nginx_configure
  tags: master

- name: Installing nginx
  become: yes
  shell: make && make install
  args:
          chdir: "{{ nginx_install_dir }}"
  environment:
          CFLAGS: "-Wno-error=deprecated-declarations"
  when: nginx_configure.changed
  tags: master

- name: Create nginx service file
  become: yes
  template: src=nginx.service.j2 dest=/etc/systemd/system/nginx.service
  tags: master

- name: Install Netdata packages
  become: yes
  apt:
          name: "{{ netdata_pkgs }}"
          state: latest
  register: netdata_pkg_install
  retries: 20
  delay: 15
  until: netdata_pkg_install is succeeded

- name: Download Netdata repo
  git:
          repo: https://github.com/netdata/netdata.git
          dest: "{{ netdata_dir }}"
          version: "{{ netdata_version }}"
          depth: 1

- name: Install extra system packages
  become: yes
  apt:
          name: "{{ extra_pkgs }}"
          state: latest
  register: extra_pkg_install
  retries: 20
  delay: 15
  until: extra_pkg_install is succeeded

- name: Start nginx
  service: name=nginx state=started enabled=yes
  tags: master
